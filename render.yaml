services:
  - type: web
    name: ccms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://ccms-web.onrender.com
      - key: STAFF_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_TEST_TO
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ENABLE_DEMO_LOGINS
        value: "false"
      - key: DEMO_APPLICANT_USERNAME
        value: demo-applicant
      - key: DEMO_APPLICANT_PASSWORD
        sync: false
      - key: DEMO_STAFF_USERNAME
        value: demo-staff
      - key: DEMO_STAFF_PASSWORD
        sync: false
      - key: DEMO_ADMIN_USERNAME
        value: demo-admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false

  - type: web
    name: ccms-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ccms-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
